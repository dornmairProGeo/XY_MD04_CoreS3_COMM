; XY-MD04 Temperatur/Luftfeuchte (RS485 Modbus RTU) -- Multi-Sensor-Scan
; M5Stack CoreS3 (ESP32-S3, 16 MB Flash, 8 MB PSRAM, native USB)
; + Module COMMU (RS485-Transceiver SP3485, automatische Richtungsumschaltung)
; Basis: xy_md04_atom_dtu2 v1.8.0 (ATOM DTU NB-IoT2)

[env:m5stack-cores3]
platform  = espressif32@6.13.0
board     = m5stack-cores3
framework = arduino

; CoreS3 = native USB-CDC. Port pruefen mit: pio device list
; Falls der Upload nicht startet: Reset-Taste halten bis LED gruen -> Download-Modus.
;upload_port  = COMxx
;monitor_port = COMxx

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

lib_deps =
    m5stack/M5Unified@^0.3.0
